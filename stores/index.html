<style>
/* layout idea: pine side rail of ledgers on the right, working sheet on the left; tables are the page */
:root{

  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1411; --surface:#171f1b; --sunk:#1d2722; --ink:#e8eeea; --muted:#9aa69f; --line:#2a352f;
  --brand:#56b693; --brand-ink:#06140e; --brand-soft:#1c2f27; --side:#0b1813; --side-ink:#cfe0d8;
  --good:#4cc965; --good-bg:#143019; --bad:#f08080; --bad-bg:#3a1a1a; --warn:#e8b653; --warn-bg:#3a2d10;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1411; --surface:#171f1b; --sunk:#1d2722; --ink:#e8eeea; --muted:#9aa69f; --line:#2a352f;
  --brand:#56b693; --brand-ink:#06140e; --brand-soft:#1c2f27; --side:#0b1813; --side-ink:#cfe0d8;
  --good:#4cc965; --good-bg:#143019; --bad:#f08080; --bad-bg:#3a1a1a; --warn:#e8b653; --warn-bg:#3a2d10;

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}

#app{display:flex;height:100%}

.sq{display:flex;gap:6px;align-items:stretch}.sq select{flex:1;min-width:0}.sq .btn{white-space:nowrap}
.dlg{background:var(--surface);border-radius:14px;width:min(100%,860px);max-height:100%;display:flex;flex-direction:column}

.dlg .body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.ln{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--sunk)}

.ln .w2{grid-column:span 2} @media (max-width:420px){.ln .w2{grid-column:auto}}
#toast{position:fixed;bottom:16px;inset-inline:16px;z-index:70;display:none;justify-content:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px}
.paper{background:#fff;color:#111;padding:20px;border:1px solid var(--line);border-radius:8px;direction:rtl;font-size:13px;line-height:1.6}
.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{border:1px solid #bbb;padding:5px 8px;text-align:right;color:#111}.paper th{background:#eee}.paper td.n{text-align:left;direction:ltr;white-space:nowrap}
#printarea{display:none}
.pbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}.pbox summary{cursor:pointer;font-weight:600}.pltab{width:100%;border-collapse:collapse}.pltab td,.pltab th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}.pltab input[type=date],.pltab input[type=number]{width:100%;min-width:110px}.pltab select{min-width:110px}.pltab tr.xtra{background:rgba(242,179,61,.12)}
.brandlock{display:flex;align-items:center;gap:12px;color:var(--ink)}.brandlock .bmark{width:52px;height:52px;flex:none}.brandlock .bwords{display:flex;flex-direction:column;gap:2px}.brandlock .bname{height:34px;width:auto}.brandlock .bsub{font-size:13px;color:var(--accent,#1f8a64);font-weight:600}
.brandlock.lg .bmark{width:68px;height:68px}.brandlock.lg .bname{height:44px}
.hello{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.hello .brandlock{padding-left:18px;border-left:1px solid var(--line)}
.credit{display:flex;align-items:center;justify-content:center;gap:8px;margin:28px 0 8px;font-size:12.5px;color:var(--mute,#6b7a73);text-align:center}.credit .bmark{width:20px;height:20px;flex:none}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}@media (max-width:960px){.pos{grid-template-columns:1fr}}
.pleft .grow{flex:1;min-width:220px}.pleft .grow input{width:100%;font-size:17px;padding:10px 12px}
.pcats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.chip.on{background:var(--pri,#1d5a45);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);color:var(--ink);cursor:pointer;min-height:92px;font:inherit}
.pitem:hover{border-color:var(--pri,#1d5a45);box-shadow:0 2px 10px rgba(0,0,0,.06)}.pitem b{font-size:14px;line-height:1.35}.pitem span{font-size:16px;font-weight:700;color:var(--pri,#1d5a45)}.pitem small{font-size:11.5px;opacity:.7}.pitem.out{opacity:.55}
.pcart{color:var(--ink);position:sticky;top:8px;border:1px solid var(--line);border-radius:14px;background:var(--card,#fff);padding:14px;display:flex;flex-direction:column;gap:10px}
.pcart label{display:flex;flex-direction:column;gap:4px;font-size:12.5px}.pcart select,.pcart input{width:100%}.crow.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clines{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}.cline{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.cline .cn{display:flex;flex-direction:column;font-size:13.5px}.cline .cn small{opacity:.65}.cline .cq{display:flex;align-items:center;gap:3px}.cline .cq input{width:52px;text-align:center;padding:4px}.cline .ct{min-width:70px;text-align:left}

      <a class="homebtn" href="#home" aria-label="كل الأقسام" title="كل الأقسام"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="3" cy="3" r="2"/><circle cx="10" cy="3" r="2"/><circle cx="17" cy="3" r="2"/><circle cx="3" cy="10" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="17" cy="10" r="2"/><circle cx="3" cy="17" r="2"/><circle cx="10" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></a>

<script>
const DBN=(window.SEED&&SEED.edition==='pos')?'zabtaha-stores':'accounting-book';
"use strict";
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const fmt=n=>{n=r2(n||0);return n===0?'–':n.toLocaleString('en-US',{maximumFractionDigits:2})};
const fmt0=n=>r2(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'–';
const short=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?(n/1e3).toFixed(0)+'K':String(Math.round(n))};
const balHtml=n=>{n=r2(n);return n===0?'–':fmt(Math.abs(n))+' <span class="mute" style="font-size:11px">'+(n>0?'مدين':'دائن')+'</span>'};
const ym=d=>d?d.slice(0,7):'';
const addM=(m,k)=>{let[y,mo]=m.split('-').map(Number);mo+=k;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+p2(mo)};
function toast(t){const e=$('#toast');e.firstElementChild.textContent=t;e.style.display='flex';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function banner(t,btn,act){const b=$('#banner');b.innerHTML=esc(t)+(btn?' <button class="btn sm" data-act="'+act+'">'+esc(btn)+'</button>':'');b.style.display=t?'block':'none'}

/* ============ state ============ */
const LISTS=['accounts','customers','suppliers','custodies','centers','inst','journal','items','whs','moves','docs','assets','emps','payruns','recon','audit','stk'];

/* ============ storage adapters: Claude db (if hosted there) or browser IndexedDB ============ */
const Store={kind:'mem',db:null,idb:null,cache:{},q:Promise.resolve(),pending:0,failed:false,
  async init(){
    try{const u=window.claude&&window.claude.use;if(u){const d=await Promise.race([u('db'),new Promise(r=>setTimeout(()=>r(null),10000))]);if(d){this.db=d;this.kind='cloud';return}}}catch(e){}
    try{this.idb=await new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('book');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});this.kind='local'}catch(e){this.kind='mem'}
  },
  async loadAll(){const o={};
    if(this.kind==='cloud'){const s=await this.db.collection('book').limit(1000).get();s.docs.forEach(d=>o[d.id]=d.data())}
    else if(this.kind==='local'){await new Promise((res,rej)=>{const c=this.idb.transaction('book').objectStore('book').openCursor();c.onsuccess=()=>{const k=c.result;if(k){o[k.key]=k.value;k.continue()}else res()};c.onerror=()=>rej(c.error)})}
    for(const k in o)this.cache[k]=JSON.stringify(o[k]);return o},
  _w(id,data){
    if(this.kind==='cloud'){const d=this.db.doc('book/'+id);return data===undefined?d.delete():d.set(data)}
    return new Promise((res,rej)=>{const t=this.idb.transaction('book','readwrite');const s=t.objectStore('book');data===undefined?s.delete(id):s.put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  put(id,data){const js=data===undefined?undefined:JSON.stringify(data);if(this.cache[id]===js)return;if(js===undefined)delete this.cache[id];else this.cache[id]=js;
    FileSync.schedule();if(this.kind==='mem')return;const val=js===undefined?undefined:JSON.parse(js);this.pending++;sync();
    this.q=this.q.then(()=>this._w(id,val).catch(e=>{if(e&&(e.code==='unavailable'||e.code==='resource_exhausted'))return new Promise(r=>setTimeout(r,1800)).then(()=>this._w(id,val));throw e}))
      .catch(e=>{this.failed=true;banner('تعذّر حفظ آخر تعديل ('+((e&&e.code)||'خطأ')+'). خذ نسخة احتياطية من صفحة الإعدادات ثم أعد فتح البرنامج.')})
      .then(()=>{this.pending--;sync();if(!this.pending)Tabs.say()})}
};
/* several windows of the program on the same computer: tell the others when data changed so nobody overwrites anybody */
const Tabs={ch:null,stale:false,
  init(){if(Store.kind!=='local'||typeof BroadcastChannel==='undefined')return;this.ch=new BroadcastChannel(DBN);this.ch.onmessage=()=>{this.stale=true;this.check()};setInterval(()=>this.check(),1000)},
  say(){try{this.ch&&this.ch.postMessage(1)}catch(e){}},
  async check(){if(!this.stale||Store.pending||FileSync.busy||document.querySelector('#modal.on'))return;this.stale=false;
    try{const o=await Store.loadAll();if(hydrate(o)){render();toast('تم تحديث البيانات من نافذة أخرى')}}catch(e){}}};
/* ---- data file on the computer's disk (Chrome / Edge): survives clearing browser data ---- */
const KV={db:null,async open(){if(!this.db)this.db=await new Promise((res,rej)=>{const r=indexedDB.open((DBN==='accounting-book'?'accounting-file':DBN+'-file'),1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this.db},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');v===undefined?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}};
const FileSync={h:null,ok:false,t:null,busy:false,again:false,last:null,
  can(){return Store.kind==='local'&&typeof window.showSaveFilePicker==='function'},
  /* guard: if reading the saved link ever kills the page, the next start skips it and asks for the file again */
  async load(){let flag=null;try{flag=localStorage.getItem((DBN+'-fh'))}catch(e){}
    if(flag){this.skipped=true;try{localStorage.removeItem((DBN+'-fh'))}catch(e){}try{await KV.set('fh',undefined)}catch(e){}return}
    try{localStorage.setItem((DBN+'-fh'),'1')}catch(e){}
    try{this.h=(await KV.get('fh'))||null;if(this.h)this.ok=(await this.h.queryPermission({mode:'readwrite'}))==='granted'}catch(e){this.h=null;this.ok=false}
    try{localStorage.removeItem((DBN+'-fh'))}catch(e){}},
  async remember(h,ok){this.h=h;this.ok=ok;try{await KV.set('fh',h)}catch(e){}},
  async forget(){this.h=null;this.ok=false;try{await KV.set('fh',undefined)}catch(e){}},
  schedule(){if(!this.h||!this.ok)return;clearTimeout(this.t);this.t=setTimeout(()=>{this.t=null;this.write()},1000)},
  async write(){if(!this.h||!this.ok)return;if(this.busy){this.again=true;return}this.busy=true;sync();
    try{const w=await this.h.createWritable();await w.write(JSON.stringify(snapshot()));await w.close();this.last=new Date();fileBanner()}
    catch(e){this.ok=false;fileBanner('تعذّر الكتابة في ملف البيانات ('+((e&&e.name)||'خطأ')+').')}
    finally{this.busy=false;if(this.again){this.again=false;this.write()}sync()}}};
function fileBanner(err){if(Store.failed)return;if(FileSync.skipped&&!FileSync.h)return banner('تعذّر الوصول لملف البيانات المربوط. بياناتك محفوظة في المتصفح؛ اربط الملف مرة أخرى من الإعدادات.','الإعدادات','gosetup');if(err)return banner(err+' البيانات محفوظة في المتصفح، لكن الملف لم يتحدّث.','إعادة السماح','fileperm');
  if(FileSync.h&&!FileSync.ok)return banner('الحفظ في ملف البيانات ('+FileSync.h.name+') متوقف حتى تسمح للبرنامج بالكتابة فيه.','السماح بالحفظ في الملف','fileperm');banner('')}

function sync(){const e=$('#sync');if(Store.kind==='mem')e.textContent='بدون حفظ';else e.textContent=Store.failed?'⚠ لم يُحفظ':(Store.pending||FileSync.busy||FileSync.t)?'جارٍ الحفظ…':FileSync.h?(FileSync.ok?'✓ محفوظ في الملف':'⚠ الملف متوقف'):'✓ محفوظ'}

const V={zv:{z:''},rep:{from:'',to:''},jr:{q:'',from:'',to:'',acc:'',unb:false,page:0},st:{type:'acc',code:''},ins:{tab:'table',q:'',month:'',year:''},ent:{q:''},sk:{q:'',wh:'',only:''},ex:{acc:'',cc:''},pr:{acc:'',cc:''},mv:{q:'',item:'',wh:'',type:''}};
function accKey(a){if(a.level==='تفصيلي')return a.code;const c=a.code;return c.endsWith('000')?c.slice(0,-3):c.endsWith('00')?c.slice(0,-2):c}
function leaves(a){if(a.level==='تفصيلي')return[a];const k=accKey(a);return details().filter(x=>x.code.startsWith(k))}
/* sums per key: [before-from debit, before-from credit, period debit, period credit] */
let SKIPCL=false;
function sums(keyOf,f,t){const m=new Map();for(const l of S.journal){if(t&&l.date>t)continue;if(SKIPCL&&l.tag==='قيد إقفال')continue;const k=keyOf(l);if(!k)continue;let e=m.get(k);if(!e)m.set(k,e=[0,0,0,0]);if(f&&l.date<f){e[0]+=l.d;e[1]+=l.c}else{e[2]+=l.d;e[3]+=l.c}}return m}
function balRow(o,e){e=e||[0,0,0,0];const op=(o.od||0)-(o.oc||0)+e[0]-e[1];const cl=op+e[2]-e[3];return{od:Math.max(op,0),oc:Math.max(-op,0),pd:e[2],pc:e[3],cd:Math.max(cl,0),cc:Math.max(-cl,0),net:cl}}
function trial(f,t){const m=sums(l=>l.a,f,t);return details().map(a=>Object.assign({code:a.code,name:a.name,cls:a.cls,nature:a.nature,parent:a.parent},balRow(a,m.get(a.code))))}
function partySummary(kind,list,f,t){const m=sums(l=>l[kind],f,t);return list.map(x=>Object.assign({},x,balRow(x,m.get(x.code))))}
function centerReport(f,t){const m=new Map();for(const l of S.journal){if(!l.cc||(f&&l.date<f)||(t&&l.date>t))continue;let e=m.get(l.cc);if(!e)m.set(l.cc,e=[0,0]);const c=cls(l.a);if(c==='إيرادات')e[0]+=l.c-l.d;else if(c==='مصروفات')e[1]+=l.d-l.c}
  return S.centers.map(c=>{const e=m.get(c.code)||[0,0];return Object.assign({},c,{rev:e[0],exp:e[1],net:e[0]-e[1],margin:e[0]?(e[0]-e[1])/e[0]:0})})}
function statement(type,code,f,t){
  let match,open=0,title='';
  if(type==='acc'){const a=IX.acc.get(code);if(!a)return null;const lv=leaves(a),set=new Set(lv.map(x=>x.code));match=l=>set.has(l.a);open=lv.reduce((s,x)=>s+(x.od||0)-(x.oc||0),0);title=a.code+' — '+a.name}
  else if(type==='cc'){const c=IX.cc.get(code);if(!c)return null;match=l=>l.cc===code;title=c.code+' — '+c.name}
  else{const x=IX[type].get(code);if(!x)return null;match=l=>l[type]===code;open=(x.od||0)-(x.oc||0);title=x.code+' — '+x.name}
  const eff=type==='cc'?l=>{const c=cls(l.a);return c==='إيرادات'?l.c-l.d:c==='مصروفات'?-(l.d-l.c):0}:l=>l.d-l.c;
  const ls=S.journal.filter(match).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let run=open,td=0,tc=0;const rows=[];
  for(const l of ls){if(t&&l.date>t)continue;if(f&&l.date<f){run+=eff(l);continue}
    if(!rows.length)open=run;run+=eff(l);td+=l.d;tc+=l.c;
    rows.push({date:l.date,no:l.no,desc:l.desc,info:type==='acc'?[nm('cc',l.cc),nm('cu',l.cu)||nm('su',l.su)||nm('cs',l.cs)].filter(Boolean).join(' · '):nm('acc',l.a),d:l.d,c:l.c,run})}
  if(!rows.length)open=run;
  return{title,open,td,tc,close:run,rows}}
function dash(f,t){
  const o={rev:0,exp:0,coll:0};const months=[];const m0=ym(f)||ym(S.journal.reduce((a,l)=>!a||l.date<a?l.date:a,''))||ym(today());
  for(let i=0;i<12;i++)months.push({m:addM(m0,i),rev:0,exp:0,coll:0,sup:0});const mi=new Map(months.map(x=>[x.m,x]));
  const ea=new Map(),ec=new Map(),ra=new Map(),rc=new Map(),cu=new Map(),pt=new Map(),su=new Map();
  const add=(m,k,v)=>m.set(k,(m.get(k)||0)+v);
  for(const l of S.journal){if((f&&l.date<f)||(t&&l.date>t))continue;const c=cls(l.a),mm=mi.get(ym(l.date));
    if(c==='إيرادات'){const v=l.c-l.d;o.rev+=v;add(ra,l.a,v);if(l.cc)add(rc,l.cc,v);if(mm)mm.rev+=v}
    else if(c==='مصروفات'){const v=l.d-l.c;o.exp+=v;add(ea,l.a,v);if(l.cc)add(ec,l.cc,v);if(mm)mm.exp+=v}
    if(l.cu){const v=l.c-l.d;o.coll+=v;add(cu,l.cu,v);add(pt,l.a,v);if(mm)mm.coll+=v}
    if(l.su){let e=su.get(l.su);if(!e)su.set(l.su,e=[0,0]);e[0]+=l.d;e[1]+=l.c;if(mm)mm.sup+=l.d}}
  let cum=0;months.forEach(x=>{x.net=x.rev-x.exp;cum+=x.net;x.cum=cum});
  const top=(m,k,n)=>[...m].filter(e=>r2(e[1])!==0).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>({name:nm(k,e[0]),v:e[1]}));
  o.net=o.rev-o.exp;o.months=months;o.topExp=top(ea,'acc',8);o.topExpCC=top(ec,'cc',8);o.revAcc=top(ra,'acc',6);o.topRevCC=top(rc,'cc',5);
  o.topCu=top(cu,'cu',8);o.payType=top(pt,'acc',6);o.activeCu=[...cu.values()].filter(v=>v>0).length;o.avgPay=o.activeCu?o.coll/o.activeCu:0;
  o.sup=[...su].map(e=>({name:nm('su',e[0]),d:e[1][0],c:e[1][1],net:e[1][1]-e[1][0]})).sort((a,b)=>(b.d+b.c)-(a.d+a.c));
  o.supDue=o.sup.reduce((s,x)=>s+Math.max(x.net,0),0);o.supAdv=o.sup.reduce((s,x)=>s+Math.max(-x.net,0),0);
  const td=today();o.ins={paid:0,late:0,next:0};S.inst.forEach(i=>o.ins[insState(i,td)]++);return o}
const insState=(i,td)=>i.status==='مسدد'?'paid':(i.due&&i.due<td?'late':'next');

const MT=['وارد','منصرف','تحويل','رصيد افتتاحي','تسوية زيادة','تسوية عجز'],IN=new Set(['وارد','رصيد افتتاحي','تسوية زيادة']);
function stock(){const m=new Map(),g=c=>{let e=m.get(c);if(!e)m.set(c,e={qty:0,val:0,wh:new Map()});return e},add=(e,w,q)=>e.wh.set(w,(e.wh.get(w)||0)+q);
  for(const x of S.moves){const e=g(x.item);
    if(x.type==='تحويل'){add(e,x.wh,-x.qty);add(e,x.wh2,x.qty)}
    else if(IN.has(x.type)){e.qty+=x.qty;e.val+=x.qty*x.cost;add(e,x.wh,x.qty)}
    else{e.qty-=x.qty;e.val-=x.qty*x.cost;add(e,x.wh,-x.qty)}}
  return m}

function nextCode(k){const E=ENT[k];let mx=0;S[k].forEach(x=>{const n=parseInt(String(x.code).slice(E.pre.length));if(n>mx)mx=n});return E.pre+String(mx+1).padStart(3,'0')}

function saveEnt(){const{k,code}=EE,E=ENT[k],o={};E.f.forEach(f=>{const v=$('#f_'+f[0]).value;o[f[0]]=f[2]==='n'?num(v):v.trim()});

function delEnt(){const{k,code}=EE,E=ENT[k];const used=S.journal.some(l=>l[E.jk]===code)||(k==='customers'&&S.inst.some(i=>i.cu===code))||(k==='centers'&&S.inst.some(i=>i.cc===code))||(k==='accounts'&&S.accounts.some(a=>a.parent===code))||(k==='items'&&S.moves.some(m=>m.item===code))||(k==='whs'&&(S.whs.length<2||S.moves.some(m=>m.wh===code||m.wh2===code)));

function saveEntry(force){const E=ED,err=m=>{$('#err').textContent=m};const no=String(E.no).trim();
  if(!no)return err('رقم القيد مطلوب.');if(!E.date)return err('تاريخ القيد مطلوب.');
  const ls=E.lines.filter(l=>l.a||num(l.d)||num(l.c));if(ls.length<2)return err('القيد يحتاج سطرين على الأقل: مدين ودائن.');
  for(const l of ls){if(!l.a)return err('اختر الحساب لكل سطر فيه مبلغ.');const d=num(l.d),c=num(l.c);if((d>0)===(c>0))return err('كل سطر يحتاج مبلغاً في خانة واحدة: مدين أو دائن.');if(d<0||c<0)return err('المبالغ لا تكون سالبة.')}
  if(String(E.orig)!==no&&S.journal.some(l=>String(l.no)===no))return err('رقم القيد '+no+' مستخدم من قبل.');
  const d=ls.reduce((s,l)=>s+num(l.d),0),c=ls.reduce((s,l)=>s+num(l.c),0);
  if(Math.abs(d-c)>0.005&&!force){err('القيد غير متزن: الفرق '+fmt(d-c)+'. صحّح المبالغ، أو اضغط «حفظ القيد» مرة ثانية لحفظه كما هو.');E.warned=true;return}
  const nn=/^\d+$/.test(no)?parseInt(no):no;
  const out=ls.map(l=>{const[pk,pc]=l.p?l.p.split(':'):[];return{date:E.per?(l.date||E.date):E.date,no:nn,desc:E.per?(l.desc||E.desc):E.desc,tag:l.tag.trim(),a:l.a,cc:l.cc,cu:pk==='cu'?pc:'',su:pk==='su'?pc:'',cs:pk==='cs'?pc:'',d:r2(num(l.d)),c:r2(num(l.c))}});
  if(E.orig!=null){const at=S.journal.findIndex(l=>String(l.no)===String(E.orig));S.journal=S.journal.filter(l=>String(l.no)!==String(E.orig));S.journal.splice(at,0,...out)}else S.journal.push(...out);
  persist('journal');closeModal();render();toast('تم حفظ القيد '+no)}

async function saveFile(name,data,mime){
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast('تعذّر تنزيل الملف في هذا المتصفح')}}

  if(t.foot)aoa.push(cols.map(c=>t.foot[c.k]===undefined?'':typeof t.foot[c.k]==='number'?r2(t.foot[c.k]):t.foot[c.k]));const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=cols.map(c=>({wch:c.n?14:22}));return ws}

  tables.forEach(t=>{let n=String(t.title).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,28)||'ورقة';while(used[n])n=n.slice(0,26)+' '+(used[n]++);used[n]=2;const ws=sheetOf(t);ws['!views']=[{rightToLeft:true}];XLSX.utils.book_append_sheet(wb,ws,n)});
  saveFile(name+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}),XM)}

function parseOwn(wb,s,dt){const rows=n=>{const ws=wb.Sheets[n];if(!ws)return[];return XLSX.utils.sheet_to_json(ws,{raw:true,defval:''})};
  const ent=(k,n)=>rows(n).map(r=>{const o={};ENT[k].f.forEach(f=>{const v=r[f[1]];o[f[0]]=f[2]==='n'?r2(num(v)):f[2]==='d'?dt(v):s(v)});return o}).filter(o=>o.code&&o.name);
  const o={meta:{company:S.meta.company,from:S.meta.from,to:S.meta.to}};
  o.accounts=ent('accounts','دليل الحسابات').filter(a=>/^\d+$/.test(a.code));o.customers=ent('customers','بيانات العملاء');o.suppliers=ent('suppliers','بيانات الموردين');o.custodies=ent('custodies','بيانات العهد');o.centers=ent('centers','مراكز التكلفة');o.items=ent('items','الأصناف');

const PTYPES=['قسط','دفعة مقدمة','دفعة سنوية','وديعة صيانة','دفعة استلام','دفعة أخرى'];
const ptype=x=>x.type||'قسط';
function renumber(cu,cc){S.inst.filter(x=>x.cu===cu&&(x.cc||'')===(cc||'')).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0).forEach((x,i)=>x.no=String(i+1))}
const monthEnd=(due,k)=>{const m=addM(due.slice(0,7),k),last=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return m+'-'+p2(Math.min(+due.slice(8),last))};
let PL=null;
function planOpen(cu,cc){PL={cu:cu||'',cc:cc||'',rows:[],g:{type:'قسط',due:today(),n:'12',amt:'',k:'1'},x:{type:'دفعة سنوية',due:today(),amt:'',n:'1',k:'12'}};planLoad();drawPlan()}
function planLoad(){PL.rows=PL.cu?S.inst.filter(x=>x.cu===PL.cu&&(x.cc||'')===PL.cc).map(x=>Object.assign({type:'قسط'},x)):[];planSort()}
function planSort(){PL.rows.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:PTYPES.indexOf(ptype(a))-PTYPES.indexOf(ptype(b)))}

function planSave(){const P=PL,err=m=>{$('#err').textContent=m};
  for(const[i,x]of P.rows.entries()){if(!x.due)return err('الدفعة رقم '+(i+1)+' بدون تاريخ.');if(!(num(x.amt)>0))return err('الدفعة رقم '+(i+1)+' قيمتها صفر.')}
  planSort();const rows=P.rows.map((x,i)=>{const o={cu:P.cu,cc:P.cc,no:String(i+1),due:x.due,amt:r2(num(x.amt)),status:x.status==='مسدد'?'مسدد':'غير مسدد',paid:x.status==='مسدد'?(x.paid||today()):''};if(ptype(x)!=='قسط')o.type=ptype(x);return o});
  S.inst=S.inst.filter(x=>!(x.cu===P.cu&&(x.cc||'')===P.cc)).concat(rows);persist('inst');closeModal();render();toast('تم حفظ خطة السداد ('+rows.length+' دفعة)')}
function planHtml(){const P=PL,p=IX.cu.get(P.cu)||{},tot=P.rows.reduce((s,x)=>s+num(x.amt),0),paid=P.rows.filter(x=>x.status==='مسدد').reduce((s,x)=>s+num(x.amt),0);

Object.assign(A,{
  insplan(el){const x=el.dataset.i!==undefined?S.inst[+el.dataset.i]:null;planOpen(x?x.cu:'',x?x.cc:'')},
  plgen(){const g=PL.g,n=parseInt(g.n)||0,k=parseInt(g.k)||1,amt=r2(num(g.amt));if(!g.due||n<1||n>360||!(amt>0)){$('#err').textContent='أدخل تاريخ أول قسط والقيمة وعدد الأقساط (1–360).';return}
    for(let i=0;i<n;i++)PL.rows.push({type:'قسط',due:monthEnd(g.due,i*k),amt,status:'غير مسدد',paid:''});planSort();drawPlan();toast('تمت إضافة '+n+' قسط — اضغط «حفظ الخطة»')},
  pladd(){const x=PL.x,n=Math.max(1,parseInt(x.n)||1),k=parseInt(x.k)||12,amt=r2(num(x.amt));if(!x.due||!(amt>0)){$('#err').textContent='أدخل المبلغ وتاريخ التحصيل.';return}
    for(let i=0;i<n;i++)PL.rows.push({type:x.type,due:monthEnd(x.due,i*k),amt,status:'غير مسدد',paid:''});PL.x.amt='';planSort();drawPlan();toast('تمت الإضافة في مكانها حسب التاريخ')},
  pldel(el){PL.rows.splice(+el.dataset.i,1);drawPlan()},
  plclear(){if(!confirm('حذف كل الدفعات غير المسددة من خطة هذا العميل؟ (لن يُحفظ إلا بعد «حفظ الخطة»)'))return;PL.rows=PL.rows.filter(x=>x.status==='مسدد');drawPlan()},
  plshift(){const m=prompt('ترحيل كل الدفعات غير المسددة بعدد شهور (اكتب رقماً سالباً للتقديم):','1');const k=parseInt(m);if(!k)return;PL.rows.forEach(x=>{if(x.status!=='مسدد')x.due=monthEnd(x.due,k)});planSort();drawPlan()},
  plsave(){planSave()},
  plprint(){const keep=PL;const h=planHtml(),p=IX.cu.get(keep.cu)||{};closeModal();PL=keep;preview(h,null,p.phone)},
  plwa(){const P=PL,p=IX.cu.get(P.cu)||{},nx=P.rows.filter(x=>x.status!=='مسدد').slice(0,6);sendWA([S.meta.company||'','خطة السداد: '+(p.name||''),...nx.map(x=>x.due+' — '+ptype(x)+' — '+f0(num(x.amt))+' '+(S.meta.cur||'')),'المتبقي: '+f0(P.rows.filter(x=>x.status!=='مسدد').reduce((s,x)=>s+num(x.amt),0))+' '+(S.meta.cur||'')].filter(Boolean).join('\n'),p.phone)}});

/* ---- QR (byte mode, ECC M, versions 1-40) ---- */
const QR=(()=>{
const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
const dataCw=v=>Math.floor(rawMods(v)/8)-ECC[v]*BLK[v];
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
const rsGen=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
const rsRem=(data,gen)=>{const r=gen.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);gen.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
function utf8(s){return Array.from(new TextEncoder().encode(s))}
function make(text){const data=typeof text==='string'?utf8(text):Array.from(text);
  let ver=1;for(;ver<=40;ver++){const cc=ver<10?8:16,bits=4+cc+data.length*8;if(bits<=dataCw(ver)*8)break}
  if(ver>40)throw new Error('QR: data too long');
  const bb=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bb.push((v>>>i)&1)};
  put(4,4);put(data.length,ver<10?8:16);data.forEach(b=>put(b,8));
  const cap=dataCw(ver)*8;put(0,Math.min(4,cap-bb.length));put(0,(8-bb.length%8)%8);

/* ---- قائمة التدفقات النقدية (الطريقة المباشرة) ---- */
const cashSet=()=>new Set(details().filter(a=>a.cls==='أصول'&&/بنك|بنوك|خزينة|صندوق|نقد/.test(a.name)).map(a=>a.code));
function cfCat(code){const a=IX.acc.get(code);if(!a)return'تشغيل';if(a.cf)return a.cf;if(a.cls==='حقوق ملكية')return'تمويل';if(a.cls==='أصول'&&/ثابت|معدات|مباني|أراضي|سيارات|أثاث|عقار|آلات|حاسب|أجهزة/.test(a.name))return'استثمار';if(a.cls==='خصوم'&&/قرض|قروض|تمويل|طويل/.test(a.name))return'تمويل';return'تشغيل'}
function cfCalc(){const c=V.cf,cs=cashSet(),f=c.from,t=c.to;let open=0,close=0;cs.forEach(code=>{const a=IX.acc.get(code);open+=(a.od||0)-(a.oc||0);close+=(a.od||0)-(a.oc||0)});
  const ent=new Map();S.journal.forEach(l=>{if(t&&l.date>t)return;const d=l.d-l.c;if(cs.has(l.a)){close+=d;if(f&&l.date<f)open+=d}});
  S.journal.forEach(l=>{const k=String(l.no);let e=ent.get(k);if(!e)ent.set(k,e={cash:false,lines:[]});if(cs.has(l.a))e.cash=true;else e.lines.push(l)});
  const cat={تشغيل:new Map(),استثمار:new Map(),تمويل:new Map()};let unc=0;
  ent.forEach(e=>{if(!e.cash)return;e.lines.forEach(l=>{if((f&&l.date<f)||(t&&l.date>t))return;const v=r2(l.c-l.d);if(!v)return;const k=cfCat(l.a),n=nm('acc',l.a),m=cat[k];m.set(n,r2((m.get(n)||0)+v))})});
  const net={};let tot=0;Object.keys(cat).forEach(k=>{net[k]=r2([...cat[k].values()].reduce((s,x)=>s+x,0));tot=r2(tot+net[k])});return{cat,net,tot,open:r2(open),close:r2(close)}}
VIEWS.cashflow=()=>{const X=cfCalc(),rows=[];['تشغيل','استثمار','تمويل'].forEach(k=>{rows.push({name:'التدفقات النقدية من أنشطة '+k,v:X.net[k],g:1});[...X.cat[k]].filter(e=>e[1]).sort((a,b)=>b[1]-a[1]).forEach(e=>rows.push({name:e[0]+(e[1]>=0?' (قبض)':' (دفع)'),v:e[1]}));rows.push({name:'صافي التدفق من أنشطة '+k,v:X.net[k],tot:1})});
  rows.push({name:'صافي التغير في النقدية',v:X.tot,tot:1},{name:'النقدية أول الفترة',v:X.open},{name:'النقدية آخر الفترة',v:r2(X.open+X.tot),tot:1});const ok=Math.abs(X.open+X.tot-X.close)<0.01;
  return '<div class="bar">'+period('cf')+'<span class="chip '+(ok?'good':'bad')+'">'+(ok?'مطابقة لأرصدة الخزينة والبنوك ✓':'فرق مع أرصدة النقدية '+fmt(X.open+X.tot-X.close))+'</span><span class="sp"></span>'+xbtn()+'</div>'+stmtTable('قائمة التدفقات النقدية',rows)+'<p class="note">الطريقة المباشرة: تُستخرج من القيود التي تمس حسابات الخزينة والبنوك. تبويب كل حساب (تشغيل / استثمار / تمويل) تلقائي بحسب اسمه، ويمكن تغييره من دليل الحسابات ← تعديل الحساب ← «تبويب التدفق النقدي».</p>'};

V.sc={id:'',q:'',f:''};
const scOf=id=>S.stk.find(x=>x.id===id);
const scStat=()=>{const m=new Map();for(const [c,e] of stock())m.set(c,e);return m};
function scRows(X){const draft=X.status!=='معتمد',st=draft?scStat():null;
  return(draft?S.items.filter(i=>!X.cat||(i.cat||'')===X.cat):X.rows.map(r=>IX.it.get(r.item)||{code:r.item,name:r.item})).map(it=>{
    const code=it.code;let book,cost,counted;
    if(draft){const e=st.get(code);book=r2(((e&&e.wh.get(X.wh))||0)*1000)/1000;cost=avgOf(e,it);const v=X.counts[code];counted=v===undefined||v===''?null:num(v)}
    else{const r=X.rows.find(x=>x.item===code);book=r.book;cost=r.cost;counted=r.counted}
    const diff=counted==null?null:r2((counted-book)*1000)/1000;
    return{code,name:it.name,cat:it.cat||'',unit:it.unit||'',book,counted,diff,cost:r2(cost),val:diff==null?0:r2(diff*cost),st:counted==null?'لم يُعدّ':!diff?'مطابق':diff<0?'عجز':'زيادة'}})}
function scSum(rows){const c=rows.filter(r=>r.counted!=null);return{n:c.length,short:r2(c.filter(r=>r.diff<0).reduce((s,r)=>s+r.val,0)),over:r2(c.filter(r=>r.diff>0).reduce((s,r)=>s+r.val,0)),diffs:c.filter(r=>r.diff).length}}
VIEWS.stocktake=()=>{const X=scOf(V.sc.id);if(!X)return scList();const rows=scRows(X),sm=scSum(rows),q=V.sc.q.trim(),f=V.sc.f,draft=X.status!=='معتمد';

   '<label>بحث<input type="search" data-set="sc.q" data-live value="'+esc(V.sc.q)+'" placeholder="اسم أو كود"></label><label>عرض<select data-set="sc.f"><option value="">الكل</option><option value="diff"'+(f==='diff'?' selected':'')+'>الفروقات فقط</option><option value="un"'+(f==='un'?' selected':'')+'>غير المعدود</option><option value="done"'+(f==='done'?' selected':'')+'>المعدود</option></select></label></div>'+
   '<div class="grid kpis"><div class="kpi"><small>أصناف معدودة</small><b id="sc_n">'+sm.n+'</b><i>من '+rows.length+'</i></div><div class="kpi"><small>قيمة العجز</small><b class="neg" id="sc_sh">'+fmt(Math.abs(sm.short))+'</b></div><div class="kpi"><small>قيمة الزيادة</small><b id="sc_ov">'+fmt(sm.over)+'</b></div><div class="kpi"><small>صافي الفرق</small><b id="sc_net" class="'+(r2(sm.short+sm.over)<0?'neg':'')+'">'+fmt(r2(sm.short+sm.over))+'</b></div></div>'+
   '<div class="bar">'+(draft?'<button class="btn" data-act="scfill">تعبئة غير المعدود بالكمية الدفترية</button><label>حساب فروق الجرد<select id="sc_acc" data-sc-acc="1">'+accOptsAll(X.acc||scAcc(),'— اختر —')+'</select></label>':'')+'<span class="sp"></span><button class="btn" data-act="scsheet">طباعة ورقة الجرد</button><button class="btn" data-act="screp">طباعة تقرير الفروقات</button>'+xbtn()+(draft?'<button class="btn pri" data-act="scok">اعتماد الجرد وتسوية الفروقات</button>':'')+'</div>'+
