<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Cg%20transform%3D%22translate%280%200%29%20scale%281.0%29%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231f8a64%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230d4a38%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%22112%22%20height%3D%22112%22%20rx%3D%2232%22%20fill%3D%22url%28%23g%29%22/%3E%3Cpath%20d%3D%22M30%2030h60M30%2046h60%22%20stroke%3D%22%23f2b33d%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3Cpath%20d%3D%22M32%2078l19%2019%2039-39%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22none%22/%3E%3C/g%3E%3C/svg%3E">

<style>
/* layout idea: pine side rail of ledgers on the right, working sheet on the left; tables are the page */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#eef1ed; --ink:#15201b; --muted:#5d6962; --line:#dde3dc;
  --brand:#1d5a45; --brand-ink:#ffffff; --brand-soft:#e2efe9; --side:#113428; --side-ink:#d9e8e1;
  --good:#006300; --good-bg:#e2f3e2; --bad:#b92c2c; --bad-bg:#fbe6e6; --warn:#7a5200; --warn-bg:#fdf0cf;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1411; --surface:#171f1b; --sunk:#1d2722; --ink:#e8eeea; --muted:#9aa69f; --line:#2a352f;
  --brand:#56b693; --brand-ink:#06140e; --brand-soft:#1c2f27; --side:#0b1813; --side-ink:#cfe0d8;
  --good:#4cc965; --good-bg:#143019; --bad:#f08080; --bad-bg:#3a1a1a; --warn:#e8b653; --warn-bg:#3a2d10;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1411; --surface:#171f1b; --sunk:#1d2722; --ink:#e8eeea; --muted:#9aa69f; --line:#2a352f;
  --brand:#56b693; --brand-ink:#06140e; --brand-soft:#1c2f27; --side:#0b1813; --side-ink:#cfe0d8;
  --good:#4cc965; --good-bg:#143019; --bad:#f08080; --bad-bg:#3a1a1a; --warn:#e8b653; --warn-bg:#3a2d10;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:17px} h3{font-size:14.5px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{display:flex;height:100%}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--side);color:#fff;flex:none}
#top h1{font-size:17px;flex:1;min-width:0;color:#fff}
.homebtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;text-decoration:none}
.homebtn:hover{background:rgba(255,255,255,.24)}
.homebtn svg{width:20px;height:20px;fill:currentColor}
#brandco{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
@media (max-width:520px){#brandco{display:none}}
#sync{font-size:12px;color:var(--side-ink);white-space:nowrap}
#tabs{display:flex;gap:2px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
#tabs:empty{display:none}
#tabs a{padding:10px 12px;color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
#tabs a:hover{color:var(--ink)}
#tabs a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
#banner{display:none;padding:8px 16px;background:var(--warn-bg);color:var(--warn);font-size:13px}
#view{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#view>*{flex-shrink:0}
.hello{max-width:900px;width:100%;margin:6px auto 0}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px;max-width:900px;width:100%;margin:0 auto}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);text-align:center}
.app:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(0,0,0,.09)}
.app .ic{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff}
.app b{font-family:var(--f-display);font-size:14.5px;font-weight:600}
.app small{color:var(--muted);font-size:12px}
svg.i{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card>h3{margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi b{font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums;direction:ltr;display:block;text-align:right}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.bar label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.bar .sp{flex:1}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input[type=number]{direction:ltr;text-align:left}
input[type=search]{min-width:170px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12.5px;white-space:nowrap;position:sticky;top:0}
tr:last-child>td{border-bottom:0}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{direction:rtl}
tfoot td{font-weight:700;background:var(--sunk)}
tr.click{cursor:pointer} tr.click:hover>td{background:var(--brand-soft)}
tr.eh>td{background:var(--sunk);font-weight:600;border-top:2px solid var(--line)}
tr.grp>td{background:var(--sunk);font-weight:700}
td.l1{font-weight:700} td.l2{font-weight:600;padding-inline-start:22px} td.l3{padding-inline-start:38px} td.l4{padding-inline-start:54px} td.l5{padding-inline-start:70px} td.l6{padding-inline-start:86px} td.hd{font-weight:600} td.l1,td.l2,td.l3,td.l4,td.l5,td.l6{text-align:start}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.nw{white-space:nowrap} .mute{color:var(--muted)} .pos{color:var(--good)} .neg{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13.5px}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
/* charts */
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;height:170px;align-items:end;border-bottom:1px solid var(--line);position:relative;direction:ltr}
.cols .gl{position:absolute;inset-inline:0;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted);pointer-events:none}
.cols .gl span{position:absolute;top:-8px;left:0;background:var(--surface);padding-inline-end:4px}
.col{display:flex;gap:2px;align-items:end;height:100%;justify-content:center;cursor:pointer;position:relative;z-index:1}
.col i{display:block;width:42%;max-width:16px;border-radius:4px 4px 0 0;min-height:1px}
.col:hover i,.col:focus i{filter:brightness(1.15)}
.xl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-size:10.5px;color:var(--muted);text-align:center;direction:ltr;margin-top:4px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:5px}
.hb .v{direction:ltr;font-variant-numeric:tabular-nums;font-size:12.5px;text-align:left}
#tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;display:none;max-width:240px}
/* modal */
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
#qmodal{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:12px}
#qmodal.on{display:flex}
.sq{display:flex;gap:6px;align-items:stretch}.sq select{flex:1;min-width:0}.sq .btn{white-space:nowrap}
.dlg{background:var(--surface);border-radius:14px;width:min(100%,860px);max-height:100%;display:flex;flex-direction:column}
.dlg.sm{width:min(100%,460px)}
.dlg header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dlg header h2{flex:1}
.dlg .body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.ln{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--sunk)}
.ln label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.ln .w2{grid-column:span 2} @media (max-width:420px){.ln .w2{grid-column:auto}}
#toast{position:fixed;bottom:16px;inset-inline:16px;z-index:70;display:none;justify-content:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px}
.paper{background:#fff;color:#111;padding:20px;border:1px solid var(--line);border-radius:8px;direction:rtl;font-size:13px;line-height:1.6}
.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{border:1px solid #bbb;padding:5px 8px;text-align:right;color:#111}.paper th{background:#eee}.paper td.n{text-align:left;direction:ltr;white-space:nowrap}
#printarea{display:none}
.pbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}.pbox summary{cursor:pointer;font-weight:600}.pltab{width:100%;border-collapse:collapse}.pltab td,.pltab th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}.pltab input[type=date],.pltab input[type=number]{width:100%;min-width:110px}.pltab select{min-width:110px}.pltab tr.xtra{background:rgba(242,179,61,.12)}
.brandlock{display:flex;align-items:center;gap:12px;color:var(--ink)}.brandlock .bmark{width:52px;height:52px;flex:none}.brandlock .bwords{display:flex;flex-direction:column;gap:2px}.brandlock .bname{height:34px;width:auto}.brandlock .bsub{font-size:13px;color:var(--accent,#1f8a64);font-weight:600}
.brandlock.lg .bmark{width:68px;height:68px}.brandlock.lg .bname{height:44px}
.hello{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.hello .brandlock{padding-left:18px;border-left:1px solid var(--line)}
.credit{display:flex;align-items:center;justify-content:center;gap:8px;margin:28px 0 8px;font-size:12.5px;color:var(--mute,#6b7a73);text-align:center}.credit .bmark{width:20px;height:20px;flex:none}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}@media (max-width:960px){.pos{grid-template-columns:1fr}}
.pleft .grow{flex:1;min-width:220px}.pleft .grow input{width:100%;font-size:17px;padding:10px 12px}
.pcats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.chip.on{background:var(--pri,#1d5a45);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);color:var(--ink);cursor:pointer;min-height:92px;font:inherit}
.pitem:hover{border-color:var(--pri,#1d5a45);box-shadow:0 2px 10px rgba(0,0,0,.06)}.pitem b{font-size:14px;line-height:1.35}.pitem span{font-size:16px;font-weight:700;color:var(--pri,#1d5a45)}.pitem small{font-size:11.5px;opacity:.7}.pitem.out{opacity:.55}
.pcart{color:var(--ink);position:sticky;top:8px;border:1px solid var(--line);border-radius:14px;background:var(--card,#fff);padding:14px;display:flex;flex-direction:column;gap:10px}
.pcart label{display:flex;flex-direction:column;gap:4px;font-size:12.5px}.pcart select,.pcart input{width:100%}.crow.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clines{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}.cline{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.cline .cn{display:flex;flex-direction:column;font-size:13.5px}.cline .cn small{opacity:.65}.cline .cq{display:flex;align-items:center;gap:3px}.cline .cq input{width:52px;text-align:center;padding:4px}.cline .ct{min-width:70px;text-align:left}
.ctot{background:var(--soft,#f2f5f3);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}.ctot>div{display:flex;justify-content:space-between}.ctot .big{font-size:20px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.chg{display:flex;flex-direction:column;justify-content:center;font-size:12.5px}.chg b{font-size:20px}.cbtns{display:flex;gap:8px;flex-wrap:wrap}.cbtns .big{flex:1;font-size:16px;padding:12px}.cbtns kbd{font-size:11px;opacity:.7;margin-right:6px}
.held{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.cempty{text-align:center;padding:18px 0}
.donebig{font-size:22px;font-weight:700;text-align:center}.donechg{font-size:18px;text-align:center}.donechg b{font-size:26px}
.paper.rcpt{width:76mm;margin:auto;padding:10px;font-size:12px}.paper.rcpt .rmeta{margin:8px 0;border-top:1px dashed #999;border-bottom:1px dashed #999;padding:6px 0}.paper.rcpt table.rt td,.paper.rcpt table.rt th{border:0;border-bottom:1px dotted #ccc;padding:3px 2px}.paper.rcpt table.tot{margin-top:6px}

@media print{@page{size:A4;margin:12mm}body.printing>*:not(#printarea){display:none!important}body.printing #printarea{display:block!important}body.printing{background:#fff!important;overflow:visible!important;height:auto!important}.paper{border:0;padding:0}}
</style>
</head>

<div id="app">
  <div id="main">
    <header id="top">
      <a class="homebtn" href="#home" aria-label="كل الأقسام" title="كل الأقسام"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="3" cy="3" r="2"/><circle cx="10" cy="3" r="2"/><circle cx="17" cy="3" r="2"/><circle cx="3" cy="10" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="17" cy="10" r="2"/><circle cx="3" cy="17" r="2"/><circle cx="10" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></a>
      <h1 id="title">جارٍ التحميل…</h1>
      <span id="brandco"></span>
      <span id="sync"></span>
    </header>
    <nav id="tabs"></nav>
    <div id="banner"></div>
    <main id="view"><p class="mute">جارٍ تحميل البيانات…</p></main>
  </div>
</div>
<div id="modal"></div><div id="qmodal"></div>
<div id="toast"><div></div></div>
