<style>
/* layout idea: pine side rail of ledgers on the right, working sheet on the left; tables are the page */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1411; --surface:#171f1b; --sunk:#1d2722; --ink:#e8eeea; --muted:#9aa69f; --line:#2a352f;
  --brand:#56b693; --brand-ink:#06140e; --brand-soft:#1c2f27; --side:#0b1813; --side-ink:#cfe0d8;
  --good:#4cc965; --good-bg:#143019; --bad:#f08080; --bad-bg:#3a1a1a; --warn:#e8b653; --warn-bg:#3a2d10;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1411; --surface:#171f1b; --sunk:#1d2722; --ink:#e8eeea; --muted:#9aa69f; --line:#2a352f;
  --brand:#56b693; --brand-ink:#06140e; --brand-soft:#1c2f27; --side:#0b1813; --side-ink:#cfe0d8;
  --good:#4cc965; --good-bg:#143019; --bad:#f08080; --bad-bg:#3a1a1a; --warn:#e8b653; --warn-bg:#3a2d10;

}
*{box-sizing:border-box}

.app:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(0,0,0,.09)}

.span2{grid-column:span 2}@media(max-width:700px){.span2{grid-column:auto}}.ssw{position:relative;display:block;flex:1;min-width:0;width:100%}.ssw .ssi{width:100%}.sshid{position:absolute!important;opacity:0;width:1px!important;height:1px!important;min-width:0!important;pointer-events:none;top:0;inset-inline-start:0}.ssp{position:absolute;z-index:60;inset-inline:0;top:calc(100% + 2px);max-height:240px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}.ssp.up{top:auto;bottom:calc(100% + 2px)}.sso{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line);text-align:start}.sso:last-child{border:0}.sso small{color:var(--muted);font-size:11px;margin-inline-end:6px}.sso.on{font-weight:700}.sso.act,.sso:hover{background:rgba(18,133,95,.13)}.sso.none{color:var(--muted);cursor:default}
.app small{color:var(--muted);font-size:11px;line-height:1.3}

.tabs{display:flex;gap:6px;flex-wrap:wrap}

.ln{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--sunk)}

#printarea{display:none}
.pbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}.pbox summary{cursor:pointer;font-weight:600}.pltab{width:100%;border-collapse:collapse}.pltab td,.pltab th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}.pltab input[type=date],.pltab input[type=number]{width:100%;min-width:110px}.pltab select{min-width:110px}.pltab tr.xtra{background:rgba(242,179,61,.12)}

<div id="app">

<script>
